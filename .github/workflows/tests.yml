name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only PyTorch wheel to keep CI smaller and faster.
          grep -v '^torch' requirements.txt > /tmp/requirements-base.txt
          python -m pip install -r /tmp/requirements-base.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2,<3.0"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test real RWTH dataset
        run: |
          python - <<'PY'
          from src.matsci_lens import load_crystallization_dataset

          X, y = load_crystallization_dataset()
          assert len(X) >= 100, f"Unexpectedly few rows with Tx: {len(X)}"
          assert X.shape[1] >= 2, f"Unexpectedly few composition features: {X.shape[1]}"
          assert y.notna().all(), "The target contains missing values after preparation"
          print(f"RWTH dataset OK: {len(X)} rows, {X.shape[1]} composition features")
          print(f"Tx range: {y.min():.2f} to {y.max():.2f} K")
          print(f"Feature columns: {list(X.columns)}")
          PY
