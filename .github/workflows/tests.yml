name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only PyTorch wheel to keep CI smaller and faster.
          grep -v '^torch' requirements.txt > /tmp/requirements-base.txt
          python -m pip install -r /tmp/requirements-base.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2,<3.0"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
